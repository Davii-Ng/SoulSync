name: CI/CD 

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_API_KEY: test-dummy-key
      ELEVENLABS_API_KEY: test-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # backend/tests stub the agent modules, so they run in their own process from backend/.
      # `python -m pytest` puts the cwd on sys.path so tests can `from main import app`.
      - name: Backend tests + coverage
        run: python -m pytest -q tests --cov=app --cov-report=term
        working-directory: backend
      - name: Agent / emotion engine tests + coverage
        run: python -m pytest -q tests --cov=multi_tool_agent --cov-report=term
      - name: Safety gate (crisis recall must be 100%)
        run: python benchmarks/eval_emotion.py --gate
  
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true